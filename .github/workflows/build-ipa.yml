name: Build Unsigned IPA

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available schemes (check this matches below)
        run: xcodebuild -list

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies

      # NOTE: adjust -project/-scheme below to match what the previous
      # "List available schemes" step actually prints for this repo.
      - name: Build for iOS device (unsigned)
        run: |
          xcodebuild build \
            -project fullmoon.xcodeproj \
            -scheme fullmoon \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package .app into .ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app")
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: app-unsigned.ipa
